<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta
      name="description"
      content="WebMCP and the agent-ready browser: registering frontend tools that AI agents can actually call."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"
    />
    <link rel="stylesheet" type="text/css" href="./deck/styles.css" />
    <style>
      /* Presenter notes are a dense reading pane, not part of the deck design. */
      .notes * {
        padding: 0 !important;
        line-height: 1 !important;
        font-size: 20px !important;
      }
    </style>
    <title>The Frontend Strikes Back</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- Pins, prefix remaps, and scopes are explained in docs/dependencies.md.
         Read it before changing a version -- most entries here are load-bearing. -->
    <script type="importmap">
      {
        "imports": {
          "htm": "https://cdn.jsdelivr.net/npm/htm@3.1.1/+esm",
          "prism-react-renderer": "https://cdn.jsdelivr.net/npm/prism-react-renderer@2.4.1/+esm",
          "react": "https://cdn.jsdelivr.net/npm/react@19.2.8/+esm",
          "react/jsx-runtime": "https://cdn.jsdelivr.net/npm/react@19.2.8/jsx-runtime/+esm",
          "react-dom": "https://cdn.jsdelivr.net/npm/react-dom@19.2.8/+esm",
          "react-dom/client": "https://cdn.jsdelivr.net/npm/react-dom@19.2.8/client/+esm",
          "react-live": "https://cdn.jsdelivr.net/npm/react-live@4.1.8/+esm",
          "spectacle": "https://cdn.jsdelivr.net/npm/spectacle@10.2.3/+esm",
          "styled-components": "https://cdn.jsdelivr.net/npm/styled-components@6.5.1/+esm",
          "@emotion/is-prop-valid": "https://cdn.jsdelivr.net/npm/@emotion/is-prop-valid@1.4.0/+esm",

          "https://cdn.jsdelivr.net/npm/react@17.0.2/": "https://cdn.jsdelivr.net/npm/react@19.2.8/",
          "https://cdn.jsdelivr.net/npm/react@18.2.0/": "https://cdn.jsdelivr.net/npm/react@19.2.8/",
          "https://cdn.jsdelivr.net/npm/react@18.3.1/": "https://cdn.jsdelivr.net/npm/react@19.2.8/",
          "https://cdn.jsdelivr.net/npm/react@19.0.0/": "https://cdn.jsdelivr.net/npm/react@19.2.8/",
          "https://cdn.jsdelivr.net/npm/react@19.1.0/": "https://cdn.jsdelivr.net/npm/react@19.2.8/",
          "https://cdn.jsdelivr.net/npm/react@19.1.1/": "https://cdn.jsdelivr.net/npm/react@19.2.8/",
          "https://cdn.jsdelivr.net/npm/react@19.2.0/": "https://cdn.jsdelivr.net/npm/react@19.2.8/",
          "https://cdn.jsdelivr.net/npm/react@19.2.4/": "https://cdn.jsdelivr.net/npm/react@19.2.8/",
          "https://cdn.jsdelivr.net/npm/react@19.2.7/": "https://cdn.jsdelivr.net/npm/react@19.2.8/",
          "https://cdn.jsdelivr.net/npm/react-dom@19.1.0/": "https://cdn.jsdelivr.net/npm/react-dom@19.2.8/",
          "https://cdn.jsdelivr.net/npm/react-dom@19.2.0/": "https://cdn.jsdelivr.net/npm/react-dom@19.2.8/",
          "https://cdn.jsdelivr.net/npm/react-dom@19.2.7/": "https://cdn.jsdelivr.net/npm/react-dom@19.2.8/",
          "https://cdn.jsdelivr.net/npm/react-is@18.3.1/": "https://cdn.jsdelivr.net/npm/react-is@19.2.8/",

          "https://cdn.jsdelivr.net/npm/styled-components@5.3.11/": "https://cdn.jsdelivr.net/npm/styled-components@6.5.1/",
          "https://cdn.jsdelivr.net/npm/react-spring@9.7.5/": "https://cdn.jsdelivr.net/npm/react-spring@10.0.4/",
          "https://cdn.jsdelivr.net/npm/kbar@0.1.0-beta.40/": "https://cdn.jsdelivr.net/npm/kbar@0.1.0-beta.48/",
          "https://cdn.jsdelivr.net/npm/react-syntax-highlighter@15.6.6/": "https://cdn.jsdelivr.net/npm/react-syntax-highlighter@16.1.1/",
          "https://cdn.jsdelivr.net/npm/prism-react-renderer@2.4.0/": "https://cdn.jsdelivr.net/npm/prism-react-renderer@2.4.1/"
        },
        "scopes": {
          "https://cdn.jsdelivr.net/npm/spectacle@10.2.3/": {
            "https://cdn.jsdelivr.net/npm/react@19.2.0/+esm": "./deck/react-compat.js"
          }
        }
      }
    </script>
    <script type="module">
      import { createElement } from "react";
      import { createRoot } from "react-dom/client";
      import htm from "htm";
      import {
        FlexBox,
        Heading,
        Slide,
        Deck,
        Text,
        Link,
        Grid,
        Image,
        Markdown,
        MarkdownSlideSet,
        Notes,
        SpectacleLogo,
      } from "spectacle";
      import { StyleSheetManager } from "styled-components";
      import isPropValid from "@emotion/is-prop-valid";
      import {
        theme,
        DECK_BACKGROUND,
        photoBackground,
        SPECTACLE_ROSE,
      } from "./deck/theme.js";
      import { logosHtm, backgrounds, images } from "./deck/media.js";
      import { getExamples } from "./deck/examples.js";
      import {
        chapter,
        chapterClass,
        chapterNumber,
        applyChapterStyles,
      } from "./deck/chapters.js";
      import {
        icon,
        Icon,
        em,
        Template,
        JsSlide,
        TopicSlide,
        CodeEditor,
        RowsSlide,
        Eyebrow,
        AccentRule,
        AppearComponent,
        mdSlideProps,
        deckTransition,
      } from "./deck/components.js";
      const html = htm.bind(createElement);

      const examples = await getExamples();

      // Emits the per-chapter `--chapter-accent` rules that the divider slides
      // and every slide inside a chapter read from.
      applyChapterStyles();

      const qrCodeImg = `<img class="qr-card" src="${images.qrCode}" width="200px" style="margin-top: calc(22vh);" />`;

      // The presentation deck.
      //
      // `backgroundImage` on the Deck is inherited by every slide that does not
      // set its own -- including the markdown sets, which never see a per-slide
      // prop -- so the layered background reaches every slide from here.
      const Presentation = () => html`<${Deck}
          theme=${theme}
          template=${Template}
          transition=${deckTransition}
          backgroundImage=${DECK_BACKGROUND}
        >
          <!-- ============================================================ -->
          <!-- Intro                                                        -->
          <!-- ============================================================ -->
          <${Slide}>
            <${FlexBox} height="100%" flexDirection="column" justifyContent="center" alignItems="start">
              <${Eyebrow}>
                ${logosHtm.conf} AgntCon + MCPCon NA
              </${Eyebrow}>
              <${Heading}
                className="title-display"
                fontSize="118px"
                textAlign="left"
                margin="24px 0 0"
              >
                THE FRONTEND<br />STRIKES BACK
              </${Heading}>
              <${AccentRule} />
              <${Heading}
                className="title-subtitle"
                fontSize="h2"
                color="primary"
                textAlign="left"
                margin="32px 0 0"
              >
                WebMCP and the agent-ready browser
              </${Heading}>
            </${FlexBox}>
            <${FlexBox}
              className="title-qr"
              flexDirection="column"
              alignItems="center"
              position="absolute"
              bottom="46px"
              right="46px"
            >
              <${Image} className="qr-card" src=${images.qrCode} width="150px" height="150px" />
              <${Text} className="qr-caption" fontSize="18px" margin="12px 0 0">
                Scan for slides
              </${Text}>
            <//>
            <${Notes}>
              <${Markdown} className="notes">
                ${`
                  TODO: Cold open.
                  * ${em("Agents are already using your app")} -- just badly.
                `}
              </${Markdown}>
            </${Notes}>
          </${Slide}>
          <${Slide} ...${photoBackground(backgrounds.venue)}>
            <${FlexBox} height="100%" flexDirection="column" justifyContent="center" alignItems="center">
              <${Heading} className="slide-title" fontSize="150px" color="primary">
                <${Icon} name="heart" /> AgntCon
              </${Heading}>
            </${FlexBox}>
          </${Slide}>
          <${Slide}>
            <${FlexBox} flexDirection="column" alignSelf="center" justifyContent="left" alignItems="left">
              <${Heading} className="slide-title" fontSize="h1" color="secondary">
                Hi!
              </${Heading}>
              <${AppearComponent}>
                <${Text} fontSize="h3">
                  <${Icon} name="hand-waving" /> I'm Ryan Roemer
                </${Text}>
              </${AppearComponent}>
              <${AppearComponent}>
                <${Text} fontSize="h3">
                  ${logosHtm.nearform} I lead technology & OSS at <${Link} href="https://nearform.com" fontSize="h3">Nearform</${Link}>
                </${Text}>
              </${AppearComponent}>
              <${AppearComponent}>
                <${Text} fontSize="h3">
                  <${Icon} name="eyeglasses" /> I've been building for the web a long time...
                </${Text}>
              </${AppearComponent}>
            </${FlexBox}>
            <${Notes}>
              <${Markdown} className="notes">
                ${`
                  TODO: Personal framing.
                  * Why the ${em("frontend")} is where this fight happens.
                `}
              </${Markdown}>
            </${Notes}>
          </${Slide}>
          <${Slide} backgroundImage="url(${images.spectacle})">
            <${FlexBox} height="100%" flexDirection="column" justifyContent="center" alignItems="center">
              <${Link} href="https://nearform.com/open-source/spectacle">
                <${SpectacleLogo} size=${400} />
              </${Link}>
              <${Text} fontSize="h3">
                <${Link}
                  href="https://nearform.com/open-source"
                  color=${SPECTACLE_ROSE}
                  textDecoration="none"
                >
                  nearform.com/open-source
                </${Link}>
              </${Text}>
            </${FlexBox}>
            <${Notes}>
              <${Markdown} className="notes">
                ${`
                  * ${em("Spectacle")} is a presentation library for React.
                  * This deck runs on it: no build step, all in the browser.
                  * If you come find me later:
                    * I've got ${em("stickers")} for Spectacle and our other open source projects.
                    * ...and some ${em("t-shirts")}.
                `}
              </${Markdown}>
            </${Notes}>
          </${Slide}>
          <${Slide}>
            <${Heading} className="slide-title" textAlign="left" margin="0 0 40px">Roadmap</${Heading}>
            <${Grid} className="roadmap-grid" gridTemplateColumns="1fr 1fr" gridGap="24px">
              ${[
                // `chapter` only picks the accent, so each tile previews the
                // color of the divider it introduces. The number is the tile's
                // position in the roadmap -- using the chapter index instead
                // reads as a list with slides missing.
                { title: "Agents Today", icon: "robot", chapter: 1 },
                { title: "WebMCP", icon: "plugs-connected", chapter: 2 },
                { title: "Live Demo", icon: "monitor-play", chapter: 4 },
                { title: "In-Browser AI", icon: "browser", chapter: 5 },
              ].map(
                ({ title, icon, chapter }, i) => html`
                  <${FlexBox}
                    key=${i}
                    className=${`card card--roadmap ${chapterClass(chapter)}`}
                    flexDirection="column"
                    alignItems="stretch"
                    justifyContent="center"
                  >
                    <${FlexBox} className="roadmap__head" justifyContent="space-between" alignItems="center">
                      <${Text} className="roadmap__index" fontSize="20px" margin="0">
                        ${chapterNumber(i + 1)}
                      </${Text}>
                      <${Icon} name=${icon} className="roadmap__icon" />
                    <//>
                    <${Text} className="roadmap__title" fontSize="32px" margin="14px 0 0">
                      ${title}
                    </${Text}>
                  </${FlexBox}>
                `,
              )}
            </${Grid}>
          </${Slide}>
          <!-- ============================================================ -->
          <!-- 1. Agents are already here                                   -->
          <!-- ============================================================ -->
          <${TopicSlide} chapter=${chapter(1)} />
          <${MarkdownSlideSet} ...${mdSlideProps} className=${`md ${chapterClass(1)}`}>
            ${`
              ---
              # TODO: They already use your app

              * TODO: ${em("Screen-scraping")} the DOM
              * TODO: ${em("Playwright MCP")} clicking through human-shaped UIs
              * TODO: Brittle, slow, expensive, unaccountable

              Notes: TODO: Open with a concrete example of the bad path.

              ---
              # TODO: Why it goes badly

              * TODO: Your UI is an interface for ${em("eyes")}, not for tools
              * TODO: No schema, no contract, no ${em("discoverability")}
              * TODO: Every redesign is a breaking change

              Notes: TODO
            `}
          </${MarkdownSlideSet}>
          <!-- ============================================================ -->
          <!-- 2. WebMCP                                                    -->
          <!-- ============================================================ -->
          <${TopicSlide} chapter=${chapter(2)} />
          <${MarkdownSlideSet} ...${mdSlideProps} className=${`md ${chapterClass(2)}`}>
            ${`
              ---
              # TODO: What is WebMCP?

              * TODO: ${em("MCP")}, but in the page
              * TODO: The app ${em("registers")} tools; the agent discovers and calls them
              * TODO: \`navigator.modelContext\`

              Notes: TODO

              ---
              # TODO: A rising W3C standard

              * TODO: Where the spec lives and who's driving it
              * TODO: Current status, browser support, polyfills
              * TODO: How to follow along

              Notes: TODO

              ---
              # TODO: The contract changes

              * TODO: Reuse your existing ${em("auth")} -- the user is already signed in
              * TODO: Reuse ${em("personalization")} and app state
              * TODO: Reuse the ${em("business logic")} you already shipped
              * TODO: Much faster than standing up a separate MCP server

              Notes: TODO
            `}
          </${MarkdownSlideSet}>
          <!-- ============================================================ -->
          <!-- 3. The basics                                                -->
          <!-- ============================================================ -->
          <${TopicSlide} chapter=${chapter(3)} />
          <${MarkdownSlideSet} ...${mdSlideProps} className=${`md ${chapterClass(3)}`}>
            ${`
              ---
              # TODO: Making a function agent-callable

              1. TODO: ${em("Name")} and describe it
              2. TODO: Define an input ${em("schema")}
              3. TODO: ${em("Register")} it
              4. TODO: Return content the agent can use

              Notes: TODO: Set up the next three code slides.
            `}
          </${MarkdownSlideSet}>
          <${JsSlide} chapter=${3} title="Registering a tool"
            filename=${examples.registerTool.file} code=${examples.registerTool.code}
            notes=${`
              ## TODO: Registering a tool
              * TODO: Walk the four fields.
              * TODO: Point out that 'execute' just calls existing app code.
            `}
          />
          <${JsSlide} chapter=${3} title="Defining the schema"
            filename=${examples.toolSchema.file} code=${examples.toolSchema.code}
            notes=${`
              ## TODO: Defining the schema
              * TODO: Descriptions are prompt engineering.
              * TODO: Enums and bounds keep the agent on rails.
            `}
          />
          <${JsSlide} chapter=${3} title="The handler"
            filename=${examples.toolHandler.file} code=${examples.toolHandler.code}
            notes=${`
              ## TODO: The handler
              * TODO: Auth, preferences, and search already exist.
              * TODO: Keep the UI in sync so the human can watch.
            `}
          />
          <${Slide} className=${chapterClass(3)}>
            <${Heading} fontSize="h3" textAlign="left" margin="0 0 12px">
              TODO: Live edit
            </${Heading}>
            <${CodeEditor}
              noInline=${true}
              editorHeight="380px"
              previewHeight="140px"
              code=${`
                // TODO: Live-edit me during the talk.
                const tools = [];
                const registerTool = (tool) => tools.push(tool);

                registerTool({
                  name: "search_documents",
                  description: "Search the user's documents.",
                });

                const Tools = () => (
                  <ul>
                    {tools.map((tool) => (
                      <li key={tool.name}>
                        <b>{tool.name}</b> - {tool.description}
                      </li>
                    ))}
                  </ul>
                );

                render(<Tools />);
              `
                .replace(/\n                /g, "\n")
                .trim()}
            />
          </${Slide}>
          <!-- ============================================================ -->
          <!-- 4. Demo: Claude Desktop                                      -->
          <!-- ============================================================ -->
          <${TopicSlide} chapter=${chapter(4)} />
          <${MarkdownSlideSet} ...${mdSlideProps} className=${`md ${chapterClass(4)}`}>
            ${`
              ---
              # TODO: A frontend-only document app

              * TODO: What the app does for a human
              * TODO: The tools it exposes to an agent
              * TODO: ${em("No server")}, no MCP process, no deploy

              Notes: TODO: SWITCH TO LIVE DEMO HERE.

              ---
              # TODO: What the agent sees

              * TODO: Tool ${em("discovery")}
              * TODO: A ${em("call")}, start to finish
              * TODO: The human watching it happen in the UI

              Notes: TODO
            `}
          </${MarkdownSlideSet}>
          <${RowsSlide}
            chapter=${4}
            title="TODO: Server vs. WebMCP"
            sections=${[
              {
                title: "TODO",
                items: [
                  { text: "TODO: MCP server", icon: "hard-drives" },
                  { text: "TODO: WebMCP", icon: "browser" },
                ],
              },
              {
                title: "TODO",
                items: [
                  { text: "TODO", icon: "lock" },
                  { text: "TODO", icon: "lock-open" },
                ],
              },
              {
                title: "TODO",
                items: [
                  { text: "TODO", icon: "clock" },
                  { text: "TODO", icon: "lightning" },
                ],
              },
            ]}
            notes=${`
              ## TODO: Comparison
              * TODO: Auth, deploy, business logic, time to ship.
            `}
          />
          <!-- ============================================================ -->
          <!-- 5. All in the browser                                        -->
          <!-- ============================================================ -->
          <${TopicSlide} chapter=${chapter(5)} />
          <${MarkdownSlideSet} ...${mdSlideProps} className=${`md ${chapterClass(5)}`}>
            ${`
              ---
              # TODO: A research assistant, fully in-browser

              * TODO: What it does
              * TODO: What ${em("never leaves the device")}
              * TODO: Architecture at a glance

              Notes: TODO

              ---
              # TODO: Multi-agent coordination

              * TODO: How the agents divide the work
              * TODO: Who calls whom
              * TODO: What coordination costs

              Notes: TODO

              ---
              # TODO: Semantic search in the page

              * TODO: ${em("Embeddings")} -- generated where?
              * TODO: Where the vectors live
              * TODO: How fast is it, really

              Notes: TODO

              ---
              # TODO: On-device models

              * TODO: Which models, which runtime
              * TODO: Download size and cold start
              * TODO: What's good enough ${em("locally")} vs. what isn't

              Notes: TODO
            `}
          </${MarkdownSlideSet}>
          <!-- ============================================================ -->
          <!-- 6. Stumbling blocks                                          -->
          <!-- ============================================================ -->
          <${TopicSlide} chapter=${chapter(6)} />
          <${MarkdownSlideSet} ...${mdSlideProps} className=${`md ${chapterClass(6)}`}>
            ${`
              ---
              # TODO: What broke

              * TODO
              * TODO
              * TODO

              Notes: TODO

              ---
              # TODO: What we hacked around it

              * TODO
              * TODO
              * TODO

              Notes: TODO
            `}
          </${MarkdownSlideSet}>
          <!-- ============================================================ -->
          <!-- 7. Wrap up                                                   -->
          <!-- ============================================================ -->
          <${TopicSlide} chapter=${chapter(7)} />
          <${MarkdownSlideSet} ...${mdSlideProps} className=${`md ${chapterClass(7)}`}>
            ${`
              ---
              # TODO: The frontend-for-agents landscape

              * TODO: Specs and proposals to watch
              * TODO: Libraries and polyfills
              * TODO: Who's shipping this already

              Notes: TODO

              ---
              # TODO: Next steps

              * TODO: Pick ${em("one")} function in your app and register it
              * TODO: Drive it from a real agent
              * TODO: Where to read more

              Notes: TODO

              --- { "layout" : "columns" }

              ::section

              # This deck!

              ${icon("browser")} See the deck at:
              [ryan-roemer.github.io/the-frontend-strikes-back](https://ryan-roemer.github.io/the-frontend-strikes-back/)

              ${icon("github-logo")} ...and check out the code at:
              [ryan-roemer/the-frontend-strikes-back](https://github.com/ryan-roemer/the-frontend-strikes-back)

              ::section

              ${qrCodeImg}

              --- { "layout": "columns" }

              ::section

              # Thanks!

              ${icon("github-logo")} [ryan-roemer](https://github.com/ryan-roemer/)
              ${icon("linkedin-logo")} [in/ryanroemer](https://www.linkedin.com/in/ryanroemer/)
              ${icon("butterfly")} [@ryan-roemer.bsky.social](https://bsky.app/profile/ryan-roemer.bsky.social)
              ${icon("envelope")} [ryan.roemer@nearform.com](mailto:ryan.roemer@nearform.com)

              ::section

              ${qrCodeImg}

              Notes: \
                Find me in the hall! Love to talk agents, the web platform, and code. Stickers and t-shirts.
            `}
          </${MarkdownSlideSet}>
        </${Deck}>
      `;

      // Restores the prop filtering styled-components v6 dropped. Without it every
      // styled-system prop Spectacle uses leaks onto the DOM. See docs/dependencies.md.
      const shouldForwardProp = (prop, target) =>
        typeof target === "string" ? isPropValid(prop) : true;

      const root = createRoot(document.getElementById("root"));
      root.render(
        html`<${StyleSheetManager} shouldForwardProp=${shouldForwardProp}>
          <${Presentation} />
        </${StyleSheetManager}>`,
      );
    </script>
  </body>
</html>
