      // Restores the prop filtering styled-components v6 dropped. Without it every
      // styled-system prop Spectacle uses leaks onto the DOM. See docs/dependencies.md.
      const shouldForwardProp = (prop, target) =>
        typeof target === "string" ? isPropValid(prop) : true;

      const root = createRoot(document.getElementById("root"));
      root.render(
        html`<${StyleSheetManager} shouldForwardProp=${shouldForwardProp}>
          <${Presentation} />
        </${StyleSheetManager}>`,
      );

      // Deck assistant, on its own React root outside the deck.
      //
      // Dynamic and caught so that mounting can fail without touching the talk:
      // the chat reads `localStorage` and creates DOM, and none of that is worth
      // a blank deck.
      //
      // It also defers MOST of the chat until after the deck has rendered, which
      // `chat/harvest/` needs rather than merely prefers, since it walks the fiber
      // tree this render produces. Only most: `components.js` imports `DeckBridge`,
      // `ChatToggle` and `ToolsToggle` STATICALLY, so those three and what they
      // pull in -- `bus.js`, `state.js`, `tools/state.js`, `store.js`, `url.js` --
      // have already evaluated by the time this line runs. That is fine, because
      // none of them touch the fiber tree at import; `harvest/` is reached only
      // from here.
      //
      // Removing the assistant is three edits, and they have to go TOGETHER: this
      // call, the stylesheet link in <head>, and those three imports and elements
      // in `Template`. It is the static ones that make the order matter -- deleting
      // `chat/` while `components.js` still refers to it is the one combination
      // that does break the deck.
      import("./chat/index.js")
        .then(({ mountChat }) => mountChat())
        .catch((err) =>
          // The value itself when there is no message on it -- a rejection that is
          // not an Error, or an Error with an empty one, still has to say something.
          console.warn("[chat] not mounted:", err?.message || err),
        );
