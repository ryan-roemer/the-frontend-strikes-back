    <!-- Offline mode, localhost only and opt-in: `?offline` serves CDN files
         from `offline/` (saved by `npm run offline:fetch`), `?offline=false`
         unregisters the worker, and no flag leaves everything as it was. See
         docs/offline.md. A classic script, not a module, so it cannot run ahead
         of the import map.

         Spectacle's mode switches (presenter, overview, print) rebuild the query
         string from slideIndex, stepIndex and the mode alone, which drops
         `?offline`. So a page with no `offline` param that was reached from a
         same-origin page that had it reloads with it put back. A typed URL has
         no referrer, so opting in is still explicit. -->
    <script>
      (() => {
        const local = ["localhost", "127.0.0.1"].includes(location.hostname);
        if (!local || !("serviceWorker" in navigator)) return;
        const params = new URLSearchParams(location.search);
        if (!params.has("offline") && document.referrer) {
          const from = new URL(document.referrer);
          const inherited = from.searchParams.get("offline");
          if (from.origin === location.origin && inherited !== null) {
            params.set("offline", inherited);
            location.replace(`${location.pathname}?${params}${location.hash}`);
            return;
          }
        }
        // The same values `chat/url.js` `flag()` accepts.
        const value = params.get("offline");
        if (value === "" || value === "true" || value === "1") {
          navigator.serviceWorker.register("./sw.js").catch((err) => {
            console.warn("[offline] service worker not registered:", err);
          });
        } else if (value === "false" || value === "0") {
          navigator.serviceWorker
            .getRegistrations()
            .then((all) => all.forEach((reg) => reg.unregister()));
        }
      })();
    </script>

                3K and slows after: 17% slower at 5K, 43% at 7K. Recall went at 16K.
              * LiteRT-LM.js: ${em("maxNumTokens")} defaults to 4,096 and refuses a 7K
                prompt there. You can raise it to each model's trained length:
                128K for E2B, 256K for 12B and up.
              * E2B holds all the way: it found the code in a 125,000-token prompt,
                65 s to fill, then 38 tokens/s.
              * The bigger ones don't. Past ~24K (12B), ~32K (26B A4B) or somewhere
                under 32K (31B) they answer in gibberish, with no error. 26B A4B at 32K still found
                the code in a 30,800-token prompt.
              * So the number that decides it isn't the window; it's how long you
                wait to fill it.
              * The frontier models you use every day have 250K to 1M.
              * TODO: article title + URL.
            `}

      // Dynamic and caught so that mounting can fail without touching the talk:

      //
      // It also defers MOST of the chat until after the deck has rendered, which
      // `chat/harvest/` needs rather than merely prefers, since it walks the fiber

      // pull in -- `bus.js`, `state.js`, `tools/state.js`, `store.js`, `url.js` --

      // none of them touch the fiber tree at import; `harvest/` is reached only

      //
      // Removing the assistant is three edits, and they have to go TOGETHER: this
