<!-- Same tool as registerTool. People still get a normal form post. -->
<form toolname="search_documents"
      toolautosubmit
      tooldescription="Search the company knowledge base."
      action="/search">
  <input name="query" required
         toolparamdescription="Natural language query." />
  <button>Search</button>
</form>

<!-- Can use `"submit"` listeners with `event.agentInvoked` property handling. -->
